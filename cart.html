<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Haven</title>
    <link rel="icon" href="img/fav.png" type="image/icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="header-main">
        <nav class="header-main-nav">
            <div class="logo">BookZone</div>
            <ul class="nav-links">
                <li>
                    <div class="dropdown">
                        <button class="dropbtn">Categories <i class="fas fa-chevron-down"></i></button>
                        <div class="dropdown-content">
                            <a href="#">Fiction</a>
                            <a href="#">Non-Fiction</a>
                            <a href="#">Science</a>
                            <a href="#">History</a>
                        </div>
                    </div>
                </li>
            </ul>
            <div class="header-icons">
                <a href="#cart" class="cart-icon"><i class="fas fa-shopping-cart"></i></a>
                <div class="profile-dropdown">
                    <button class="profile-btn"><i class="fas fa-user"></i></button>
                    <div class="profile-menu">
                        <a href="#">View Profile</a>
                        <a href="#">Settings</a>
                        <a href="#">Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
